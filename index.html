<!doctype html>
<html lang="no">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alsaker SIM</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/x-icon" href="images/logo.ico">
</head>

<body>

<header>
    <h1>Alsaker SIM</h1>
    <label id="playerName"></label>
</header>

<div class="topbar">
    <button id="newDay">NY DAG</button>
    <div class="date">
        Day: <span id="day"></span>
        Month: <span id="month"></span>
        Year: <span id="year"></span>
    </div>
    <div class="balance">
        Balance: <span id="Balance"></span>
    </div>
    <button id="gambleBtn">Gamble</button>
</div>

<div class="container">

    <div class="market">
        <h2>Market</h2>
        <div id="stockList"></div>
    </div>

    <div class="sidepanel">
        <div class="portfolioBox">
            <h3>Portfolio</h3>
            <div id="portfolioValue"></div>
        </div>

        <div class="newsBox">
            <h3>News</h3>
            <div id="newsBox">No news today</div>
        </div>

        <div class="leaderboardBox">
            <h3>Leaderboard</h3>
            <div id="leaderboard"></div>
        </div>
    </div>

</div>

<!-- VIPPSRAN Fullscreen Popup -->
<div id="vippsranPopup" class="vippsran-popup">
    <div class="vippsran-content">
        <h1>VIPPSRAN!</h1>
        <p id="vippsranMessage"></p>
        <img id="vippsranImage" src="../bilte redrigos de potojop/VIPPSRAN.jpg" alt="VIPPSRAN Image">
        <button id="vippsranClose">Close</button>
    </div>
</div>

<!-- VIPPSRAN Audio -->
<audio id="vippsranSound" src="../bilte redrigos de potojop/susamogus.mp3"></audio>

<script src="js/app.js"></script>
</body>
</html>
